name: validate

on:
  push:
    # A TAG push must not start this workflow. `release.yml` calls it through
    # `workflow_call`, and both runs land in the same concurrency group
    # (`validate-${{ github.ref }}`) — so the push-triggered one cancels the
    # release's own call, `release` and `publish` are SKIPPED for a `needs:` that
    # was cancelled rather than failed, and the tag ships nothing while the run
    # list shows a green validate beside it. Measured 2026-08-20 on
    # `agent-stack v0.13.0`: validate green, release cancelled at 2s, npm still
    # serving the previous version. It is a race, which is why the two siblings
    # with the same shape happened to publish.
    tags-ignore: ['**']
  pull_request:
  # Callable, so `release.yml` gates a publish on THIS suite instead of a
  # copy of it. The negative self-tests live here as steps; running them
  # from the release workflow any other way means a second home per plant.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Structural validator
        run: python3 test/validate.py

      # Every negative self-test below plants a defect and REQUIRES a failure.
      # A validator nobody has watched fail is not evidence that it works.

      - name: The plant guard itself (content AND mode, and the incident that named it)
        run: python3 test/plant_guard_test.py

      - name: Negative self-test (a plant that does nothing must be reported, not passed)
        run: |
          set -eu
          rm -rf /tmp/noop-copy && cp -R . /tmp/noop-copy
          python3 test/plant_guard.py snap /tmp/noop-copy
          # No edit at all — the state a plant reaches when its anchor was reworded. Before
          # 2026-08-14 this repository would have run its validator on an undamaged copy,
          # seen it honestly pass, and printed "ERROR: validator accepted ..." about a
          # guard it never disarmed. Two of its eight plants were already in that state.
          if python3 test/plant_guard.py verify /tmp/noop-copy "a plant whose anchor moved"; then
            echo "ERROR: an unchanged copy was accepted as a landed plant"
            exit 1
          else
            echo "OK: a plant that did nothing is reported as such, by name"
          fi

      - name: Negative self-test (version drift must fail)
        run: |
          set -eu
          rm -rf /tmp/drift-copy && cp -R . /tmp/drift-copy
          python3 test/plant_guard.py snap /tmp/drift-copy
          python3 - <<'PY'
          # Python, never `sed -i`: BSD sed needs an argument to -i, so this plant was a
          # no-op on macOS and could only ever be exercised in CI. And it asserts it
          # changed something, so a plant that stops landing says so instead of blaming
          # the guard it can no longer disarm (instruction #6 and its corollary).
          import json, re
          p = "/tmp/drift-copy/plugins/agent-stack/.claude-plugin/plugin.json"
          s = open(p, encoding="utf-8").read()
          s2 = re.sub(r'"version":\s*"[0-9][0-9.]*"', '"version": "0.0.0-corrupt"', s, count=1)
          assert s2 != s, "PLANT DID NOT LAND: no version field in this plugin.json"
          open(p, "w", encoding="utf-8").write(s2)
          assert json.load(open(p))["version"] == "0.0.0-corrupt", "PLANT DID NOT LAND"
          PY
          python3 test/plant_guard.py verify /tmp/drift-copy "Negative self-test (version drift must fail)"
          if python3 /tmp/drift-copy/test/validate.py; then
            echo "ERROR: validator passed on a corrupted copy — it cannot fail"
            exit 1
          else
            echo "OK: validator FAILs on version drift"
          fi

      - name: Negative self-test (over-long description must fail)
        run: |
          set -eu
          rm -rf /tmp/desc-copy && cp -R . /tmp/desc-copy
          python3 test/plant_guard.py snap /tmp/desc-copy
          # The plant is STRUCTURAL: it appends a continuation line to the folded
          # `description:` scalar rather than searching for a phrase inside it.
          #
          # The previous version replaced the literal `"token wallet".`, and when
          # the description was reworded to fit the token budget that phrase left
          # the file. The replace silently no-oped, no defect was planted, the
          # validator passed, and this step reported the validator as broken —
          # every push red for a guard that was in fact fine. A plant anchored on
          # prose has a shelf life; one anchored on the file's shape does not.
          #
          # It also asserts it actually planted something, so a future change to
          # the front-matter layout fails HERE, saying so, instead of quietly
          # testing nothing.
          python3 - <<'PY'
          p = "/tmp/desc-copy/plugins/agent-stack/skills/agent-orchestrator/SKILL.md"
          s = open(p, encoding="utf-8").read()
          marker = "description: >-\n"
          assert marker in s, "front matter no longer opens the description with a folded scalar"
          s = s.replace(marker, marker + "  " + ("padding " * 40) + "\n", 1)
          open(p, "w", encoding="utf-8").write(s)
          PY
          python3 test/plant_guard.py verify /tmp/desc-copy "Negative self-test (over-long description must fail)"
          if python3 /tmp/desc-copy/test/validate.py; then
            echo "ERROR: validator accepted a description past the 1024-char limit"
            exit 1
          else
            echo "OK: validator catches front matter the host would truncate silently"
          fi

      - name: Negative self-test (a reference nobody links must fail)
        run: |
          set -eu
          rm -rf /tmp/orphan-copy && cp -R . /tmp/orphan-copy
          python3 test/plant_guard.py snap /tmp/orphan-copy
          touch /tmp/orphan-copy/plugins/agent-stack/skills/agent-orchestrator/references/nobody-loads-me.md
          python3 test/plant_guard.py verify /tmp/orphan-copy "Negative self-test (a reference nobody links must fail)"
          if python3 /tmp/orphan-copy/test/validate.py; then
            echo "ERROR: validator accepted an unreferenced reference file"
            exit 1
          else
            echo "OK: validator rejects a reference nothing loads"
          fi

      - name: Negative self-test (a dangling reference link must fail)
        run: |
          set -eu
          rm -rf /tmp/dangling-copy && cp -R . /tmp/dangling-copy
          python3 test/plant_guard.py snap /tmp/dangling-copy
          rm -f /tmp/dangling-copy/plugins/agent-stack/skills/agent-orchestrator/references/patterns.md
          python3 test/plant_guard.py verify /tmp/dangling-copy "Negative self-test (a dangling reference link must fail)"
          if python3 /tmp/dangling-copy/test/validate.py; then
            echo "ERROR: validator passed with a linked reference missing"
            exit 1
          else
            echo "OK: validator requires linked references to resolve"
          fi

      - name: Negative self-test (stray SKILL.md must fail)
        run: |
          set -eu
          rm -rf /tmp/stray-copy && cp -R . /tmp/stray-copy
          python3 test/plant_guard.py snap /tmp/stray-copy
          cp /tmp/stray-copy/plugins/agent-stack/skills/agent-orchestrator/SKILL.md \
             /tmp/stray-copy/plugins/agent-stack/SKILL.md
          python3 test/plant_guard.py verify /tmp/stray-copy "Negative self-test (stray SKILL.md must fail)"
          if python3 /tmp/stray-copy/test/validate.py; then
            echo "ERROR: validator passed with a stray SKILL.md outside plugins/*/skills/*/"
            exit 1
          else
            echo "OK: validator rejects a stray SKILL.md"
          fi

      - name: Negative self-test (a protocol reference with no revision stamp must fail)
        run: |
          set -eu
          rm -rf /tmp/stamp-copy && cp -R . /tmp/stamp-copy
          python3 test/plant_guard.py snap /tmp/stamp-copy
          # STRUCTURAL plant: delete the stamp LINE by its marker, not by any wording
          # around it. The stamp is a fixed shape (`**Spec pinned:** … · read DATE`),
          # which is precisely why the validator can require it and this can remove it.
          # Asserts it removed something, so a change to the stamp format fails HERE
          # rather than quietly testing nothing.
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("/tmp/stamp-copy/plugins/agent-stack/skills/agent-interop/references/mcp.md")
          s = p.read_text(encoding="utf-8")
          out = re.sub(r"^\*\*Spec pinned:\*\*.*\n", "", s, count=1, flags=re.M)
          assert out != s, "no `**Spec pinned:**` line found -- the stamp format changed"
          p.write_text(out, encoding="utf-8")
          PY
          python3 test/plant_guard.py verify /tmp/stamp-copy "Negative self-test (a protocol reference with no revision stamp must fail)"
          if python3 /tmp/stamp-copy/test/validate.py; then
            echo "ERROR: validator accepted protocol prose with no revision stamp"
            exit 1
          else
            echo "OK: validator requires a revision stamp on protocol references"
          fi

      - name: Negative self-test (an unreal stamp date must fail)
        run: |
          set -eu
          rm -rf /tmp/date-copy && cp -R . /tmp/date-copy
          python3 test/plant_guard.py snap /tmp/date-copy
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("/tmp/date-copy/plugins/agent-stack/skills/agent-interop/references/a2a.md")
          s = p.read_text(encoding="utf-8")
          out = re.sub(r"(^\*\*Spec pinned:\*\*.*· read )\d{4}-\d{2}-\d{2}", r"\g<1>2026-02-30",
                       s, count=1, flags=re.M)
          assert out != s, "no `· read <date>` tail found -- the stamp format changed"
          p.write_text(out, encoding="utf-8")
          PY
          python3 test/plant_guard.py verify /tmp/date-copy "Negative self-test (an unreal stamp date must fail)"
          if python3 /tmp/date-copy/test/validate.py; then
            echo "ERROR: validator accepted 2026-02-30 as a stamp date"
            exit 1
          else
            echo "OK: validator rejects a stamp date that never existed"
          fi

      - name: Negative self-test (dropping the validator from CI must fail)
        run: |
          set -eu
          rm -rf /tmp/nogate-copy && cp -R . /tmp/nogate-copy
          python3 test/plant_guard.py snap /tmp/nogate-copy
          python3 - <<'PY'
          p = "/tmp/nogate-copy/.github/workflows/validate.yml"
          s = open(p, encoding="utf-8").read()
          old = "python3 test/validate.py"
          assert old in s, "PLANT DID NOT LAND: CI no longer calls the validator by this name"
          s2 = s.replace(old, "echo skipped")
          assert s2 != s, "PLANT DID NOT LAND"
          open(p, "w", encoding="utf-8").write(s2)
          PY
          python3 test/plant_guard.py verify /tmp/nogate-copy "Negative self-test (dropping the validator from CI must fail)"
          if python3 /tmp/nogate-copy/test/validate.py; then
            echo "ERROR: validator passed while CI no longer calls it"
            exit 1
          else
            echo "OK: the gate notices when it stops being a gate"
          fi

      - name: Negative self-test (the checker contract must not shrink)
        run: |
          set -eu
          rm -rf /tmp/contract-copy && cp -R . /tmp/contract-copy
          python3 test/plant_guard.py snap /tmp/contract-copy
          # STRUCTURAL plant: delete the LAST numbered item of the checker contract,
          # whatever its number and whatever it says. The list is the gate in front of
          # every convergence this pack recommends, and it was short one from the day it was
          # written: "carries its evidence" was absent while a confidence signal stood in
          # its place, through every release that carried the reference. Nothing here could have noticed, because the two documents
          # that carry the list are worded differently on purpose so the duplication check
          # stays quiet. An item may be added; one may not leave in silence.
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("/tmp/contract-copy/plugins/agent-stack/skills/agent-orchestrator"
                           "/references/graph-engineering.md")
          s = p.read_text(encoding="utf-8")
          items = list(re.finditer(r"^\d+\. \*\*", s, re.M))
          assert items, "PLANT DID NOT LAND: no numbered contract list to shorten"
          start = items[-1].start()
          end = s.index("\n\n", start) + 1
          out = s[:start] + s[end:]
          assert out != s, "PLANT DID NOT LAND"
          p.write_text(out, encoding="utf-8")
          PY
          python3 test/plant_guard.py verify /tmp/contract-copy "Negative self-test (the checker contract must not shrink)"
          if python3 /tmp/contract-copy/test/validate.py; then
            echo "ERROR: validator accepted a checker contract with an item deleted"
            exit 1
          else
            echo "OK: the contract cannot lose an item quietly"
          fi

      - name: Negative self-test (the checker contract must keep its evidence item)
        run: |
          set -eu
          rm -rf /tmp/evidence-copy && cp -R . /tmp/evidence-copy
          python3 test/plant_guard.py snap /tmp/evidence-copy
          # Anchored on the contract KEY, not on prose: `unevidenced` is *carries its
          # evidence* from the manifesto's checker requirement, and dropping it is the exact
          # regression this repository shipped — a gate that asks a branch how sure it is and
          # never asks what it can show, in the pack whose first value is the opposite.
          # Both declarations are edited, so this tests the requirement rather than the
          # mirror check below.
          python3 - <<'PY'
          import pathlib, re
          for rel in ("agent-orchestrator/references/graph-engineering.md", "agent-evals/SKILL.md"):
              p = pathlib.Path("/tmp/evidence-copy/plugins/agent-stack/skills") / rel
              s = p.read_text(encoding="utf-8")
              out = re.sub(r"(<!--\s*checker-contract:[^>]*?)\bunevidenced,\s*", r"\1", s, count=1)
              assert out != s, f"PLANT DID NOT LAND: no `unevidenced` key in {rel}"
              p.write_text(out, encoding="utf-8")
          PY
          python3 test/plant_guard.py verify /tmp/evidence-copy "Negative self-test (the checker contract must keep its evidence item)"
          if python3 /tmp/evidence-copy/test/validate.py; then
            echo "ERROR: validator accepted a checker contract with no evidence item"
            exit 1
          else
            echo "OK: the evidence item cannot be dropped from the contract"
          fi

      - name: Negative self-test (the two homes of the checker contract must agree)
        run: |
          set -eu
          rm -rf /tmp/mirror-copy && cp -R . /tmp/mirror-copy
          python3 test/plant_guard.py snap /tmp/mirror-copy
          # The mirror is declared: the home is the graph reference, `agent-evals` states the
          # eval half and points back. Deliberately different wording is why the shingle
          # check cannot compare them — so the declaration is what gets compared, and this
          # plant drops one key from ONE side, the shape drift takes when a list is edited in
          # the file the editor happened to have open.
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("/tmp/mirror-copy/plugins/agent-stack/skills/agent-evals/SKILL.md")
          s = p.read_text(encoding="utf-8")
          m = re.search(r"<!--\s*checker-contract:\s*([^|]+?)\s*\|", s)
          assert m, "PLANT DID NOT LAND: no checker-contract declaration in the mirror"
          keys = [k.strip() for k in m.group(1).split(",") if k.strip()]
          assert len(keys) > 1, "PLANT DID NOT LAND: nothing to drop"
          out = s[:m.start(1)] + ", ".join(keys[:-1]) + s[m.end(1):]
          assert out != s, "PLANT DID NOT LAND"
          p.write_text(out, encoding="utf-8")
          PY
          python3 test/plant_guard.py verify /tmp/mirror-copy "Negative self-test (the two homes of the checker contract must agree)"
          if python3 /tmp/mirror-copy/test/validate.py; then
            echo "ERROR: validator accepted two documents naming different checker contracts"
            exit 1
          else
            echo "OK: the mirror must name the same items as its home"
          fi

      - name: Negative self-test (the node contract must not shrink)
        run: |
          set -eu
          rm -rf /tmp/node-copy && cp -R . /tmp/node-copy
          python3 test/plant_guard.py snap /tmp/node-copy
          # STRUCTURAL plant: drop the LAST field of the node contract, whatever it is
          # called. The manifesto states a useful node as one input, one job, one output,
          # one owner and its own completion test; §1 shipped three of the five — and gave
          # the manifesto's own justification in nearly the manifesto's words, so the
          # sentence never read as abridged. That is precisely the failure a floor catches
          # and a reader does not.
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("/tmp/node-copy/plugins/agent-stack/skills/agent-orchestrator"
                           "/references/graph-engineering.md")
          s = p.read_text(encoding="utf-8")
          m = re.search(r"<!--\s*node-contract:\s*([^>]+?)\s*-->", s)
          assert m, "PLANT DID NOT LAND: no node-contract declaration to shorten"
          keys = [k.strip() for k in m.group(1).split(",") if k.strip()]
          assert len(keys) > 1, "PLANT DID NOT LAND: nothing to drop"
          out = s[:m.start(1)] + ", ".join(keys[:-1]) + s[m.end(1):]
          assert out != s, "PLANT DID NOT LAND"
          p.write_text(out, encoding="utf-8")
          PY
          python3 test/plant_guard.py verify /tmp/node-copy "Negative self-test (the node contract must not shrink)"
          if python3 /tmp/node-copy/test/validate.py; then
            echo "ERROR: validator accepted a node contract with a field deleted"
            exit 1
          else
            echo "OK: the node contract cannot lose a field quietly"
          fi

      - name: Negative self-test (the node contract must keep its owner field)
        run: |
          set -eu
          rm -rf /tmp/owner-copy && cp -R . /tmp/owner-copy
          python3 test/plant_guard.py snap /tmp/owner-copy
          # Anchored on the contract KEY. `owner` is the field with no mechanical substitute:
          # `isolation: "worktree"` removes the race between two writers and answers nothing
          # about whose version is authoritative when the branches converge, so a graph with
          # isolation and no owner has moved the loss to the merge rather than removed it.
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("/tmp/owner-copy/plugins/agent-stack/skills/agent-orchestrator"
                           "/references/graph-engineering.md")
          s = p.read_text(encoding="utf-8")
          out = re.sub(r"(<!--\s*node-contract:[^>]*?)\bowner,\s*", r"\1", s, count=1)
          assert out != s, "PLANT DID NOT LAND: no `owner` key in the node contract"
          p.write_text(out, encoding="utf-8")
          PY
          python3 test/plant_guard.py verify /tmp/owner-copy "Negative self-test (the node contract must keep its owner field)"
          if python3 /tmp/owner-copy/test/validate.py; then
            echo "ERROR: validator accepted a node contract with no owner field"
            exit 1
          else
            echo "OK: the owner field cannot be dropped from the node contract"
          fi

      - name: Negative self-test (the node contract's spelled count must track its declaration)
        run: |
          set -eu
          rm -rf /tmp/nodecount-copy && cp -R . /tmp/nodecount-copy
          python3 test/plant_guard.py snap /tmp/nodecount-copy
          # COMPUTED plant, not a prose anchor: it reads the declaration, derives the number
          # word from its length, and removes that word from §1 only. Add a sixth field and
          # this plant removes "six" without being edited. It exercises the drift the
          # original defect actually was — a sentence that counts correctly for the fields it
          # kept and says nothing about the ones it lost.
          python3 - <<'PY'
          import pathlib, re
          WORDS = {1: "one", 2: "two", 3: "three", 4: "four", 5: "five", 6: "six",
                   7: "seven", 8: "eight", 9: "nine", 10: "ten"}
          p = pathlib.Path("/tmp/nodecount-copy/plugins/agent-stack/skills/agent-orchestrator"
                           "/references/graph-engineering.md")
          s = p.read_text(encoding="utf-8")
          i = s.find("## 1. Node and edge")
          assert i >= 0, "PLANT DID NOT LAND: no `## 1. Node and edge` section"
          j = s.find("\n## ", i + len("## 1. Node and edge"))
          assert j > i, "PLANT DID NOT LAND: section 1 has no following section"
          m = re.search(r"<!--\s*node-contract:\s*([^>]+?)\s*-->", s[i:j])
          assert m, "PLANT DID NOT LAND: no node-contract declaration in section 1"
          n = len([k for k in m.group(1).split(",") if k.strip()])
          word = WORDS.get(n)
          assert word, f"PLANT DID NOT LAND: no number word for {n} fields"
          body = re.sub(rf"(?<![\w-]){word}(?![\w-])", "N", s[i:j], flags=re.I)
          assert body != s[i:j], f"PLANT DID NOT LAND: section 1 never spells {word!r}"
          p.write_text(s[:i] + body + s[j:], encoding="utf-8")
          PY
          python3 test/plant_guard.py verify /tmp/nodecount-copy "Negative self-test (the node contract's spelled count must track its declaration)"
          if python3 /tmp/nodecount-copy/test/validate.py; then
            echo "ERROR: validator accepted a node contract whose prose never spells its count"
            exit 1
          else
            echo "OK: the spelled count must match the declared field list"
          fi

      - name: Negative self-test (the eval-tier contract must not shrink)
        run: |
          set -eu
          rm -rf /tmp/tiers-copy && cp -R . /tmp/tiers-copy
          python3 test/plant_guard.py snap /tmp/tiers-copy
          # STRUCTURAL plant: drop the LAST tier of the eval contract, whatever it is called.
          # A single tier is the state this pack shipped in — `agent-evals` said "Never author
          # the suite up front" and had no word for the criterion the manifesto requires
          # before there is code, so the corpus rule read as the whole rule.
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("/tmp/tiers-copy/plugins/agent-stack/skills/agent-evals/SKILL.md")
          s = p.read_text(encoding="utf-8")
          m = re.search(r"<!--\s*eval-tiers:\s*([^>]+?)\s*-->", s)
          assert m, "PLANT DID NOT LAND: no eval-tiers declaration to shorten"
          keys = [k.strip() for k in m.group(1).split(",") if k.strip()]
          assert len(keys) > 1, "PLANT DID NOT LAND: nothing to drop"
          out = s[:m.start(1)] + ", ".join(keys[:-1]) + s[m.end(1):]
          assert out != s, "PLANT DID NOT LAND"
          p.write_text(out, encoding="utf-8")
          PY
          python3 test/plant_guard.py verify /tmp/tiers-copy "Negative self-test (the eval-tier contract must not shrink)"
          if python3 /tmp/tiers-copy/test/validate.py; then
            echo "ERROR: validator accepted an eval-tier contract with a tier deleted"
            exit 1
          else
            echo "OK: the eval-tier contract cannot lose a tier quietly"
          fi

      - name: Negative self-test (the eval-tier spelled count must track its declaration)
        run: |
          set -eu
          rm -rf /tmp/tiercount-copy && cp -R . /tmp/tiercount-copy
          python3 test/plant_guard.py snap /tmp/tiercount-copy
          # COMPUTED plant, not a prose anchor: it reads the declaration, derives the number
          # word from its length and removes that word from §6 only. Add a third tier and this
          # plant removes "three" without being edited.
          python3 - <<'PY'
          import pathlib, re
          WORDS = {1: "one", 2: "two", 3: "three", 4: "four", 5: "five", 6: "six"}
          p = pathlib.Path("/tmp/tiercount-copy/plugins/agent-stack/skills/agent-evals/SKILL.md")
          s = p.read_text(encoding="utf-8")
          i = s.find("## 6.")
          assert i >= 0, "PLANT DID NOT LAND: no `## 6.` section"
          j = s.find("\n## ", i + len("## 6."))
          j = len(s) if j < 0 else j
          m = re.search(r"<!--\s*eval-tiers:\s*([^>]+?)\s*-->", s[i:j])
          assert m, "PLANT DID NOT LAND: no eval-tiers declaration in section 6"
          n = len([k for k in m.group(1).split(",") if k.strip()])
          word = WORDS.get(n)
          assert word, f"PLANT DID NOT LAND: no number word for {n} tiers"
          body = re.sub(rf"(?<![\w-]){word}(?![\w-])", "N", s[i:j], flags=re.I)
          assert body != s[i:j], f"PLANT DID NOT LAND: section 6 never spells {word!r}"
          p.write_text(s[:i] + body + s[j:], encoding="utf-8")
          PY
          python3 test/plant_guard.py verify /tmp/tiercount-copy "Negative self-test (the eval-tier spelled count must track its declaration)"
          if python3 /tmp/tiercount-copy/test/validate.py; then
            echo "ERROR: validator accepted an eval-tier section whose prose never spells its count"
            exit 1
          else
            echo "OK: the spelled count must match the declared tier list"
          fi

      - name: Negative self-test (a timing rule stated without its sibling tier must fail)
        run: |
          set -eu
          rm -rf /tmp/alone-copy && cp -R . /tmp/alone-copy
          python3 test/plant_guard.py snap /tmp/alone-copy
          # THE ROW ITSELF, re-planted into a document that never had it: one imperative in a
          # section that never names the other tier. This is what `agent-evals:203` was before
          # 2026-08-19, and it is why the check sweeps every section of every document rather
          # than guarding the one file the audit happened to read.
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("/tmp/alone-copy/plugins/agent-stack/skills/agent-interop/SKILL.md")
          s = p.read_text(encoding="utf-8")
          out = s + "\n## Fixtures\n\nNever author the suite up front.\n"
          assert out != s, "PLANT DID NOT LAND"
          p.write_text(out, encoding="utf-8")
          PY
          python3 test/plant_guard.py verify /tmp/alone-copy "Negative self-test (a timing rule stated without its sibling tier must fail)"
          if python3 /tmp/alone-copy/test/validate.py; then
            echo "ERROR: validator accepted an eval-timing absolute with neither tier named beside it"
            exit 1
          else
            echo "OK: a section that dates an eval must name both tiers"
          fi

      - name: Negative self-test (the two hosts of the eval-timing line must agree)
        run: |
          set -eu
          rm -rf /tmp/hostline-copy && cp -R . /tmp/hostline-copy
          python3 test/plant_guard.py snap /tmp/hostline-copy
          # One host reworded, the other left behind. Both halves still name both tiers, so
          # nothing else in this validator would notice — and a reader cannot tell which of
          # the two bars the pack now holds. Anchored on the shared line, not on a file.
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("/tmp/hostline-copy/plugins/agent-stack/skills/agent-harness/SKILL.md")
          s = p.read_text(encoding="utf-8")
          out = s.replace("only the corpus waits for production",
                          "only the corpus may wait for production", 1)
          assert out != s, "PLANT DID NOT LAND: the shared eval-timing line was not found"
          p.write_text(out, encoding="utf-8")
          PY
          python3 test/plant_guard.py verify /tmp/hostline-copy "Negative self-test (the two hosts of the eval-timing line must agree)"
          if python3 /tmp/hostline-copy/test/validate.py; then
            echo "ERROR: validator accepted two hosts stating different eval-timing bars"
            exit 1
          else
            echo "OK: the shared eval-timing line cannot diverge between its two hosts"
          fi

      - name: Negative self-test (the priority axes must stay the manifesto's four)
        run: |
          set -eu
          rm -rf /tmp/axes-copy && cp -R . /tmp/axes-copy
          python3 test/plant_guard.py snap /tmp/axes-copy
          # STRUCTURAL plant: put `effort` back in place of an axis, which is the exact state
          # that shipped — Irreversibility and Coordination absent from the whole pack, and a
          # COST standing where a risk axis belongs. Computed from the declaration, so a
          # future rename of the axes re-aims the plant without an edit here.
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("/tmp/axes-copy/plugins/agent-stack/skills/agent-harness/references/audit.md")
          s = p.read_text(encoding="utf-8")
          m = re.search(r"<!--\s*priority-axes:\s*([^>]+?)\s*-->", s)
          assert m, "PLANT DID NOT LAND: no priority-axes declaration to rewrite"
          keys = [k.strip() for k in m.group(1).split(",") if k.strip()]
          assert len(keys) > 1, "PLANT DID NOT LAND: nothing to substitute"
          out = s[:m.start(1)] + ", ".join(keys[:-1] + ["effort"]) + s[m.end(1):]
          assert out != s, "PLANT DID NOT LAND"
          p.write_text(out, encoding="utf-8")
          PY
          python3 test/plant_guard.py verify /tmp/axes-copy "Negative self-test (the priority axes must stay the manifesto's four)"
          if python3 /tmp/axes-copy/test/validate.py; then
            echo "ERROR: validator accepted a cost substituted for a manifesto risk axis"
            exit 1
          else
            echo "OK: the priority axes cannot be swapped for a cost"
          fi

      - name: Negative self-test (a priority scalar must not come back)
        run: |
          set -eu
          rm -rf /tmp/scalar-copy && cp -R . /tmp/scalar-copy
          python3 test/plant_guard.py snap /tmp/scalar-copy
          # The refused formula, reinstated as a standalone line — what a reader follows as an
          # instruction, and what shipped. The check deliberately does NOT refuse the same
          # formula inside a sentence: the paragraph recording its removal quotes it, and a
          # guard that reads a citation as a prescription refuses correct documents.
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("/tmp/scalar-copy/plugins/agent-stack/skills/agent-harness/references/audit.md")
          s = p.read_text(encoding="utf-8")
          out = s.replace("**Ordering rule:", "`P = impact \u00d7 uncertainty / effort`\n\n**Ordering rule:", 1)
          assert out != s, "PLANT DID NOT LAND: the ordering rule was not found"
          p.write_text(out, encoding="utf-8")
          PY
          python3 test/plant_guard.py verify /tmp/scalar-copy "Negative self-test (a priority scalar must not come back)"
          if python3 /tmp/scalar-copy/test/validate.py; then
            echo "ERROR: validator accepted a priority scalar beside its own refusal of one"
            exit 1
          else
            echo "OK: a prescribed priority scalar is refused"
          fi

      - name: Negative self-test (the plan must not be ordered by a number)
        run: |
          set -eu
          rm -rf /tmp/ordered-copy && cp -R . /tmp/ordered-copy
          python3 test/plant_guard.py snap /tmp/ordered-copy
          # The half a formula check alone misses: define the scalar anywhere, order by it here.
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("/tmp/ordered-copy/plugins/agent-stack/skills/agent-harness/references/audit.md")
          s = p.read_text(encoding="utf-8")
          out = s.replace("**The plan** \u2014 ordered by the axes above",
                          "**The plan** \u2014 ordered by P", 1)
          assert out != s, "PLANT DID NOT LAND: the plan's ordering line was not found"
          p.write_text(out, encoding="utf-8")
          PY
          python3 test/plant_guard.py verify /tmp/ordered-copy "Negative self-test (the plan must not be ordered by a number)"
          if python3 /tmp/ordered-copy/test/validate.py; then
            echo "ERROR: validator accepted a plan ordered by a scalar"
            exit 1
          else
            echo "OK: the plan cannot be ordered by a number"
          fi

      - name: Negative self-test (a temp tree must not bypass the residue ledger)
        run: |
          set -eu
          rm -rf /tmp/residue-copy && cp -R . /tmp/residue-copy
          python3 test/plant_guard.py snap /tmp/residue-copy
          # The bypass, planted exactly as it was found: one `residue.workspace()` swapped
          # back to a bare `tempfile.mkdtemp()`. The fixture still PASSES with this plant and
          # the ledger prints "this run left nothing — 0 temp tree(s) created", which is why
          # the ledger alone is not the check. Eight nameless trees per run is how 2576 of
          # them accumulated with every run reporting clean.
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("/tmp/residue-copy/test/plant_guard_test.py")
          s = p.read_text(encoding="utf-8")
          out = s.replace('d = residue.workspace("plant-guard")', "import tempfile; d = tempfile.mkdtemp()", 1)
          assert out != s, "PLANT DID NOT LAND: no residue.workspace() call to replace"
          p.write_text(out, encoding="utf-8")
          PY
          python3 test/plant_guard.py verify /tmp/residue-copy "Negative self-test (a temp tree must not bypass the residue ledger)"
          if python3 /tmp/residue-copy/test/validate.py; then
            echo "ERROR: validator accepted a temp tree the residue ledger cannot see"
            exit 1
          else
            echo "OK: every temp tree goes through the residue ledger"
          fi

      - name: Negative self-test (a description must stay inside the working limit)
        run: |
          set -eu
          rm -rf /tmp/desc-copy && cp -R . /tmp/desc-copy
          python3 test/plant_guard.py snap /tmp/desc-copy
          # Under the 1024 cap and over the 970 working limit — the state three of four
          # skills shipped in, one with five characters of headroom. The hard-cap check
          # passes on this plant, so it is the working limit or nothing.
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("/tmp/desc-copy/plugins/agent-stack/skills/agent-evals/SKILL.md")
          s = p.read_text(encoding="utf-8")
          # Anchored on the front-matter key, not on any sentence inside the description:
          # the words get reflowed and a prose anchor stops planting silently.
          m = re.search(r"(?m)^description: >-\n", s)
          assert m, "PLANT DID NOT LAND: no folded description block to grow"
          out = s[:m.end()] + "  padding to reach the working limit and no further.\n" + s[m.end():]
          assert out != s, "PLANT DID NOT LAND"
          p.write_text(out, encoding="utf-8")
          PY
          python3 test/plant_guard.py verify /tmp/desc-copy "Negative self-test (a description must stay inside the working limit)"
          if python3 /tmp/desc-copy/test/validate.py; then
            echo "ERROR: validator accepted a description past the house working limit"
            exit 1
          else
            echo "OK: a description cannot drift past the working limit"
          fi

      - name: Negative self-test (a verified row must not stand over an unreleased artifact)
        run: |
          set -eu
          rm -rf /tmp/ledger-copy && cp -R . /tmp/ledger-copy
          python3 test/plant_guard.py snap /tmp/ledger-copy
          # The exact state that shipped: three sections headed `unreleased`, carrying
          # "No release: the version stays 0.11.1", over 35 rows all reading `verified` —
          # while v0.12.0 was tagged, on npm and in the CHANGELOG.
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("/tmp/ledger-copy/docs/evidence/verification.md")
          s = p.read_text(encoding="utf-8")
          out = s.replace("**Shipped in v0.12.0** (tag",
                          "**No release**: the version stays `0.11.1` and the CHANGELOG is untouched. (tag", 1)
          assert out != s, "PLANT DID NOT LAND: no shipped-in paragraph to reverse"
          p.write_text(out, encoding="utf-8")
          PY
          python3 test/plant_guard.py verify /tmp/ledger-copy "Negative self-test (a verified row must not stand over an unreleased artifact)"
          if python3 /tmp/ledger-copy/test/validate.py; then
            echo "ERROR: validator accepted verified rows measured on a working tree"
            exit 1
          else
            echo "OK: a verified row cannot stand over an unreleased artifact"
          fi

      - name: Negative self-test (the ledger must not announce a release nobody cut)
        run: |
          set -eu
          rm -rf /tmp/cut-copy && cp -R . /tmp/cut-copy
          python3 test/plant_guard.py snap /tmp/cut-copy
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("/tmp/cut-copy/docs/evidence/verification.md")
          s = p.read_text(encoding="utf-8")
          # Capitalised on purpose: that is how the ledger states the claim, and the first
          # version of the check was lowercase-only, so every real claim went unchecked.
          out = s.replace("**Shipped in v0.12.0**", "**Shipped in v9.9.9**", 1)
          assert out != s, "PLANT DID NOT LAND: no shipped-in claim to falsify"
          p.write_text(out, encoding="utf-8")
          PY
          python3 test/plant_guard.py verify /tmp/cut-copy "Negative self-test (the ledger must not announce a release nobody cut)"
          if python3 /tmp/cut-copy/test/validate.py; then
            echo "ERROR: validator accepted a ledger section naming a version that does not exist"
            exit 1
          else
            echo "OK: the ledger cannot announce a release nobody cut"
          fi

      - name: Agent audit scanner — every detector must fire, and a clean file must not
        run: |
          set -eu
          # The scanner ships to users, so its own plants run in CI. It plants each defect
          # it claims to find, requires each to be found, and requires a clean file to stay
          # silent — a detector nobody has watched fire is not evidence that it works, and a
          # scanner with a false positive is discarded whole.
          python3 plugins/agent-stack/skills/agent-harness/scripts/audit_agent.py --self-test

      - name: Agent audit scanner — runs on a real tree and always discloses its blind spots
        run: |
          set -eu
          out=$(python3 plugins/agent-stack/skills/agent-harness/scripts/audit_agent.py .)
          echo "$out" | head -5
          echo "$out" | grep -q "THIS PASS CANNOT SEE" || {
            echo "ERROR: the scanner reported without disclosing what it cannot see"; exit 1; }
          echo "$out" | grep -q "code files considered:" || {
            echo "ERROR: no denominator — 'read: 1' alone reads as a broken pass"; exit 1; }
          echo "OK: scanner discloses its blind spots and its denominator"

      - name: install.sh syntax check
        run: bash -n install.sh

      - name: npm installer functional test (fresh / rerun-skip / --force / bad arg)
        run: |
          set -eu
          export HOME=/tmp/fakehome
          mkdir -p "$HOME"
          node bin/agent-stack.js
          test -f "$HOME/.claude/skills/agent-orchestrator/SKILL.md"
          test -f "$HOME/.claude/skills/agent-orchestrator/references/patterns.md"
          test -f "$HOME/.claude/skills/agent-orchestrator/references/llm-proxy-billing.md"
          # Every skill the plugin ships must arrive. The installer ENUMERATES the skills
          # directory rather than naming skills, so this asserts the enumeration works --
          # a regression there would install a subset and report success.
          for s in $(ls plugins/agent-stack/skills); do
            test -f "$HOME/.claude/skills/$s/SKILL.md" || { echo "ERROR: $s did not install"; exit 1; }
          done
          test -f "$HOME/.claude/skills/agent-interop/references/mcp.md"
          node bin/agent-stack.js | grep -q '^skip:'
          node bin/agent-stack.js --force | grep -q '^Installed'
          if node bin/agent-stack.js --wat; then
            echo "ERROR: unknown arg accepted"; exit 1
          fi
          echo "OK: installer behaves"

      - name: Workflow YAML parses
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/validate.yml')); print('workflow parses OK')"

      - name: Official Claude Code conformance (plugin + marketplace, strict)
        run: |
          set -eu
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
          claude plugin validate plugins/agent-stack --strict
